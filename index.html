<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <link rel="stylesheet" href="index.css">
</head>

<body>

    <span>

        <label id="display"></label>

        <br>
        <br>

        <button id="AC" class="btn">AC</button>
        <button id="delete" class="btn">X</button>
        <button id="modulo" class="btn" value="%">%</button>
        <button id="divide" class="btn" value="/">/</button>

        <br>

        <button id="seven" class="btn">7</button>
        <button id="eight" class="btn">8</button>
        <button id="nine" class="btn">9</button>
        <button id="multiply" class="btn" value="*">*</button>

        <br>

        <button id="four" class="btn">4</button>
        <button id="five" class="btn">5</button>
        <button id="six" class="btn">6</button>
        <button id="subtract" class="btn" value="-">-</button>

        <br>

        <button id="one" class="btn">1</button>
        <button id="two" class="btn">2</button>
        <button id="three" class="btn">3</button>
        <button id="add" class="btn" value="+">+</button>

        <br>

        <button id="double-zero" class="btn">00</button>
        <button id="zero" class="btn">0</button>
        <button id="decimal" class="btn">.</button>
        <button id="equals" class="btn">=</button>

        <br>

    </span>


    <script>

        let buttons = document.querySelectorAll(".btn");

        let res = "";

        let display = document.getElementById("display");


        buttons.forEach(btn => {

            btn.onclick = () => {


                // AC
                if (btn.id === "AC") {

                    res = "";

                    display.innerHTML = "";

                }


                // Delete last character
                else if (btn.id === "delete") {

                    res = res.slice(0, -1);

                    display.innerHTML = res;

                }


                // Equals
                else if (btn.id === "equals") {

                    res = eval(res);

                    display.innerHTML = res;

                }


                // Other buttons
                else {

                    res += btn.innerHTML;

                    display.innerHTML = res;

                }

            };

        });

    </script>

</body>
</html>
